# ============================================================
# NER + RE Pipeline — Vietnamese Configuration (Gemma 4 E4B Instruct)
# ============================================================
# Edit this file to control every aspect of the experiment.
# Run:
#   accelerate launch --multi_gpu --num_processes=2 train.py \
#       --config configs/default.yaml

# ── Model ────────────────────────────────────────────────────
model:
  # Gemma 4 E4B Instruct — Google's efficient multilingual instruct model
  # Loaded via Unsloth for 2x faster training and lower VRAM usage
  name: "unsloth/gemma-4-E4B-it"
  max_seq_length: 512
  seed: 42

# ── LoRA ─────────────────────────────────────────────────────
lora:
  r: 16
  alpha: 16
  dropout: 0.0     # Unsloth recommends 0.0 for maximum speed
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ── Training ─────────────────────────────────────────────────
training:
  # Training format:
  #   "causal"      → plain text "input\n\n### Output:\n{json}"  (base models)
  #   "instruction" → ChatML System/User/Assistant               (instruct models)
  format: "instruction"

  # Task:
  #   "ner_only" → NER extraction only
  #   "re_only"  → Relation extraction only (entities provided)
  #   "joint"    → NER + RE in a single output
  task_mode: "joint"

  # RE granularity (ignored when task_mode=ner_only):
  #   "pairwise" → 1 sample per entity pair  (better F1, more samples)
  #   "global"   → 1 sample per sentence     (faster inference, natural for JOINT)
  re_mode: "global"

  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  output_dir: "/kaggle/working/outputs"
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  
  # Fraction (0.2) or exact number (500) of eval samples to run during training
  eval_subset_size: 0.2
  
  # Number of eval loops without eval_loss improvement before stopping (0 to disable)
  early_stopping_patience: 10

# ── Data ─────────────────────────────────────────────────────
# Vietnamese-only data for Vietnamese fine-tuning
data:
  train_files:
    - path: "/kaggle/input/n2c2-eng/n2c2_2010_train_vi.jsonl"
      language: "vi"
  eval_files:
    - path: "/kaggle/input/n2c2-eng/n2c2_2010_test_vi.jsonl"
      language: "vi"
  test_files:
    - path: "/kaggle/input/n2c2-eng/n2c2_2010_test_vi.jsonl"
      language: "vi"

# ── Labels ───────────────────────────────────────────────────
# Bilingual label definitions (English + Vietnamese) to help the model
# understand medical concepts in Vietnamese context.
labels:
  entities:
    Problem:   "Vấn đề sức khỏe (Health issues) bao gồm bệnh, triệu chứng, rối loạn, chấn thương"
    Treatment: "Phương pháp điều trị (Medical interventions) bao gồm thuốc, phẫu thuật, liệu pháp, thiết bị y tế"
    Test:      "Xét nghiệm lâm sàng (Clinical measurements) bao gồm xét nghiệm máu, chẩn đoán hình ảnh, khám"

  relations:
    TrIP:  "Điều trị Cải thiện Vấn đề (Treatment Improves Problem)"
    TrWP:  "Điều trị Làm xấu Vấn đề (Treatment Worsens Problem)"
    TrCP:  "Điều trị Gây ra Vấn đề (Treatment Causes Problem)"
    TrAP:  "Điều trị Được chỉ định cho Vấn đề (Treatment Administered for Problem)"
    TrNAP: "Điều trị Không được chỉ định vì Vấn đề (Treatment Not Administered because of Problem)"
    TeRP:  "Xét nghiệm Phát hiện Vấn đề (Test Reveals Problem)"
    TeCP:  "Xét nghiệm Được thực hiện vì Vấn đề (Test Conducted because of Problem)"
    PIP:   "Vấn đề Chỉ ra Vấn đề (Problem Indicates Problem)"

  # Allowed (subject_label, object_label) pairs — used for PAIRWISE RE
  # to filter entity pairs that can logically have a clinical relation.
  valid_pairs:
    - [Treatment, Problem]
    - [Test,      Problem]
    - [Problem,   Problem]
